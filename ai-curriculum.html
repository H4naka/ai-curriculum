        "For EEG: the Module 5 deep dive gives you the model. Adding the full MLOps stack (MLflow, FastAPI, Docker, DVC, monitoring) to that project is a natural extension that creates a compelling end-to-end demonstration.",
        "The blog post forces you to articulate what is genuinely interesting about your findings. If you cannot write 500 words about what you learned, the project may not have gone deep enough.",
        "For the 5-minute demo: structure it as: (1) problem statement 30s, (2) data and EDA 60s, (3) model and SHAP results 90s, (4) the serving API in action 60s, (5) monitoring dashboard 60s. Practice it until it flows naturally — this is your elevator pitch for the project."
      ]
    }

  ] // end Module 10 items
}

]; // end CURRICULUM



// ════════════════════════════════════════════════════
//  SUPABASE CONFIG — paste your values here
// ════════════════════════════════════════════════════

const SUPABASE_URL  = 'YOUR_SUPABASE_URL';   // e.g. https://xyzxyz.supabase.co
const SUPABASE_KEY  = 'YOUR_SUPABASE_ANON_KEY';

const _supa = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ════════════════════════════════════════════════════
//  STATE & PERSISTENCE
// ════════════════════════════════════════════════════

const STORAGE_KEY = 'ai_curriculum_v1';
const EMPTY_STATE = () => ({ completed: {}, lastSeen: null, streakDate: null, streakCount: 0 });

function loadLocalState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    return saved ? JSON.parse(saved) : EMPTY_STATE();
  } catch { return EMPTY_STATE(); }
}

function saveLocalState(s) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); } catch {}
}

let appState = loadLocalState();
let _currentUser = null;

// ── Supabase sync ────────────────────────────────────

async function syncFromSupabase() {
  if (!_currentUser) return;
  try {
    const { data, error } = await _supa
      .from('progress')
      .select('data')
      .eq('user_id', _currentUser.id)
      .single();
    if (data && data.data) {
      appState = { ...EMPTY_STATE(), ...data.data };
      saveLocalState(appState);
      render();
      updateHeader();
    }
  } catch {}
}

async function syncToSupabase() {
  if (!_currentUser) return;
  try {
    await _supa.from('progress').upsert({
      user_id: _currentUser.id,
      data: appState,
      updated_at: new Date().toISOString()
    }, { onConflict: 'user_id' });
  } catch {}
}

function saveState(s) {
  saveLocalState(s);
  syncToSupabase();
}

// ── Auth ─────────────────────────────────────────────

async function handleAuthClick() {
  if (_currentUser) {
    await _supa.auth.signOut();
  } else {
    await _supa.auth.signInWithOAuth({
      provider: 'github',
      options: { redirectTo: window.location.href }
    });
  }
}

function updateAuthBtn(user) {
  const btn = document.getElementById('auth-btn');
  if (!btn) return;
  if (user) {
    const name = user.user_metadata?.user_name || user.email || 'you';
    btn.textContent = `@${name} · Sign out`;
  } else {
    btn.textContent = 'Sign in with GitHub';
  }
}

// Boot auth
(async () => {
  const { data: { session } } = await _supa.auth.getSession();
  if (session?.user) {
    _currentUser = session.user;
    updateAuthBtn(_currentUser);
    await syncFromSupabase();
  }

  _supa.auth.onAuthStateChange(async (event, session) => {
    _currentUser = session?.user || null;
    updateAuthBtn(_currentUser);
    if (_currentUser) {
      await syncFromSupabase();
    }
  });
})();

// ── Progress helpers ─────────────────────────────────

function markItemDone(itemId) {
  appState.completed[itemId] = true;
  const today = new Date().toDateString();
  if (appState.streakDate !== today) {
    const yesterday = new Date(Date.now() - 86400000).toDateString();
    appState.streakCount = (appState.streakDate === yesterday) ? (appState.streakCount + 1) : 1;
    appState.streakDate = today;
  }
  saveState(appState);
  updateHeader();
}

function isDone(itemId) { return !!appState.completed[itemId]; }

function getModuleProgress(mod) {
  if (!mod.items.length) return { done: 0, total: 0, pct: 0 };
  const done = mod.items.filter(i => isDone(i.id)).length;
  const total = mod.items.length;
  return { done, total, pct: total ? Math.round((done / total) * 100) : 0 };
}

function getTotalProgress() {
  let done = 0, total = 0;
  CURRICULUM.forEach(mod => {
    mod.items.forEach(item => {
      total++;
      if (isDone(item.id)) done++;
    });
  });
  return { done, total, pct: total ? Math.round((done / total) * 100) : 0 };
}

function updateHeader() {
  const p = getTotalProgress();
  const el1 = document.getElementById('hstat-progress');
  const el2 = document.getElementById('hstat-streak');
  if (el1) el1.innerHTML = `<b>${p.done}</b> / ${p.total} done`;
  if (el2) el2.textContent = `🔥 ${appState.streakCount} day streak`;
}


// ════════════════════════════════════════════════════
//  NAVIGATION
// ════════════════════════════════════════════════════

let nav = { view: 'dashboard', modId: null, itemId: null };

function navigate(view, modId, itemId) {
  nav = { view, modId: modId || null, itemId: itemId || null };
  render();
  window.scrollTo(0, 0);
}


// ════════════════════════════════════════════════════
//  QUIZ LOGIC
// ════════════════════════════════════════════════════

let quizState = {};

function initQuiz(questions, containerId) {
  quizState = { questions, current: 0, score: 0, answered: false, containerId };
  renderQuizQuestion();
}

function renderQuizQuestion() {
  const { questions, current, score, containerId } = quizState;
  const container = document.getElementById(containerId);
  if (!container) return;
  if (current >= questions.length) {
    container.innerHTML = `
      <div class="quiz-card">
        <div class="quiz-header-row"><span class="quiz-label">✓ Knowledge Check Complete</span><span class="quiz-score">Score: <b>${score}/${questions.length}</b></span></div>
        <div class="quiz-complete show" style="font-size:.92rem">
          ${score === questions.length ? '🎯 Perfect score!' : score >= Math.ceil(questions.length * 0.67) ? '✅ Good understanding. Review any wrong answers above.' : '📖 Consider re-reading the lesson before moving on.'}
        </div>
      </div>`;
    return;
  }
  const q = questions[current];
  const opts = q.options.map((opt, i) => `<button class="quiz-opt" onclick="answerQuiz(${i})">${opt}</button>`).join('');
  container.innerHTML = `
    <div class="quiz-card">
      <div class="quiz-header-row">
        <span class="quiz-label">📝 Knowledge Check</span>
        <span class="quiz-counter">${current + 1} / ${questions.length}</span>
      </div>
      <div class="quiz-q">${q.q}</div>
      <div class="quiz-opts">${opts}</div>
      <div class="quiz-explanation" id="quiz-exp"></div>
    </div>`;
}

function answerQuiz(chosenIdx) {
  if (quizState.answered) return;
  quizState.answered = true;
  const q = quizState.questions[quizState.current];
  const opts = document.querySelectorAll('.quiz-opt');
  const expEl = document.getElementById('quiz-exp');
  opts.forEach((btn, i) => {
    btn.disabled = true;
    if (i === q.answer) btn.classList.add('correct');
    else if (i === chosenIdx) btn.classList.add('wrong');
  });
  if (chosenIdx === q.answer) quizState.score++;
  if (expEl) { expEl.textContent = q.explanation; expEl.classList.add('show'); }
  setTimeout(() => {
    quizState.current++;
    quizState.answered = false;
    renderQuizQuestion();
  }, 2200);
}


// ════════════════════════════════════════════════════
//  HINT TOGGLES
// ════════════════════════════════════════════════════

function toggleHint(idx) {
  const btn = document.getElementById(`hint-btn-${idx}`);
  const content = document.getElementById(`hint-content-${idx}`);
  if (!btn || !content) return;
  const isOpen = content.classList.contains('show');
  content.classList.toggle('show', !isOpen);
  btn.classList.toggle('open', !isOpen);
  btn.textContent = isOpen ? `💡 Show hint ${idx + 1}` : `💡 Hide hint ${idx + 1}`;
}


// ════════════════════════════════════════════════════
//  RENDER — DASHBOARD
// ════════════════════════════════════════════════════

function renderDashboard() {
  const p = getTotalProgress();
  const totalHours = CURRICULUM.reduce((s, m) => s + m.hours, 0);

  const cards = CURRICULUM.map(mod => {
    const mp = getModuleProgress(mod);
    const isCS = !mod.available;
    const isDone = mp.pct === 100;
    return `
      <div class="module-card ${isCS ? 'coming-soon' : ''} ${isDone ? 'complete' : ''}" 
           onclick="${mod.available ? `navigate('module', ${mod.id})` : ''}">
        ${isCS ? '<div class="coming-soon-tag">Coming soon</div>' : ''}
        <div class="mc-top">
          <div class="mc-icon" style="background:${mod.color}18;color:${mod.color}">${mod.icon}</div>
          <div class="mc-num">MODULE ${String(mod.id).padStart(2,'0')}</div>
        </div>
        <div class="mc-title">${mod.title}</div>
        <div class="mc-sub">${mod.subtitle}</div>
        <div class="mc-chips">
          <div class="mc-chip">~${mod.hours}h</div>
          ${mod.items.length ? `<div class="mc-chip">${mod.items.filter(i=>i.type==='lesson').length} lessons</div><div class="mc-chip">${mod.items.filter(i=>i.type!=='lesson').length} exercises</div>` : '<div class="mc-chip">In progress</div>'}
        </div>
        <div class="mc-prog-bar"><div class="mc-prog-fill" style="width:${mp.pct}%;background:${mod.color}"></div></div>
        <div class="mc-prog-text">${mp.done}/${mp.total} completed</div>
      </div>`;
  }).join('');

  return `
    <div class="fade-up">
      <div class="dash-hero">
        <h1>Your <em>AI Engineering</em><br>Curriculum</h1>
        <p>Micro-learning designed for 10–30 min a day. Theory, code, and exercises — all in one place.</p>
        <div class="section-label" style="margin-top:1rem">Filter by time available today</div>
        <div class="time-picker">
          <div class="time-chip active" onclick="filterByTime(0, this)">All items</div>
          <div class="time-chip" onclick="filterByTime(15, this)">≤ 15 min</div>
          <div class="time-chip" onclick="filterByTime(30, this)">≤ 30 min</div>
          <div class="time-chip" onclick="filterByTime(999, this)">Deep dives</div>
        </div>
      </div>
      <div class="overall-bar">
        <div class="ob-info">
          <div class="ob-label">OVERALL CURRICULUM PROGRESS</div>
          <div class="progress-bar"><div class="progress-fill" style="width:${p.pct}%"></div></div>
        </div>
        <div class="ob-stats">
          <div class="stat"><div class="stat-v">${p.pct}%</div><div class="stat-l">Complete</div></div>
          <div class="stat"><div class="stat-v">${p.done}</div><div class="stat-l">Done</div></div>
          <div class="stat"><div class="stat-v">~${totalHours}h</div><div class="stat-l">Total</div></div>
        </div>
      </div>
      <div class="section-label">All Modules</div>
      <div class="modules-grid" id="modules-grid">${cards}</div>
    </div>`;
}

function filterByTime(maxMin, el) {
  document.querySelectorAll('.time-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  const grid = document.getElementById('modules-grid');
  if (!grid) return;
  const cards = grid.querySelectorAll('.module-card');
  cards.forEach((card, i) => {
    const mod = CURRICULUM[i];
    if (!mod) return;
    if (maxMin === 0) { card.style.display = ''; return; }
    if (maxMin === 999) {
      const hasDD = mod.items.some(it => it.type === 'deepdive');
      card.style.display = hasDD ? '' : 'none';
    } else {
      const hasMatch = mod.items.some(it => it.type !== 'deepdive' && (it.timeMin || 0) <= maxMin);
      card.style.display = (hasMatch || !mod.available) ? '' : 'none';
    }
  });
}


// ════════════════════════════════════════════════════
//  RENDER — MODULE VIEW
// ════════════════════════════════════════════════════

function renderModuleView(modId) {
  const mod = CURRICULUM.find(m => m.id === modId);
  if (!mod) return '<p>Module not found.</p>';

  const mp = getModuleProgress(mod);

  if (!mod.available || !mod.items.length) {
    return `
      <div class="fade-up">
        <div class="module-hdr">
          <button class="back-btn" onclick="navigate('dashboard')">← Dashboard</button>
          <div class="mh-info">
            <h2>${mod.icon} ${mod.title}</h2>
            <p>${mod.subtitle}</p>
          </div>
        </div>
        <div class="empty-module-notice" style="background:var(--card);border:1px dashed var(--border);border-radius:12px;padding:3rem;text-align:center;color:var(--muted);">
          <div style="font-size:2.5rem;margin-bottom:.75rem">🚧</div>
          <h3 style="color:var(--text);font-family:var(--font-d);margin-bottom:.5rem">Coming soon</h3>
          <p style="font-size:.88rem">This module's content will be added in a future update. Check back soon!</p>
        </div>
      </div>`;
  }

  const lessons = mod.items.filter(i => i.type === 'lesson');
  const exercises = mod.items.filter(i => i.type === 'exercise' || i.type === 'deepdive');

  const lessonRows = lessons.map((item, idx) => {
    const done = isDone(item.id);
    const badgeClass = { 'rust-refresh': 'b-rust', 'new': 'b-new', 'core': 'b-core' }[item.badge] || 'b-core';
    const badgeLabel = { 'rust-refresh': 'Rusty refresh', 'new': 'New', 'core': 'Core' }[item.badge] || item.badge;
    return `
      <div class="item-row ${done ? 'done' : ''}" onclick="navigate('item', ${mod.id}, '${item.id}')">
        <div class="item-status ${done ? 'done' : ''}">${done ? '✓' : (idx + 1)}</div>
        <div class="item-info">
          <div class="item-title">${item.title}</div>
          <div class="item-meta">
            <span class="badge ${badgeClass}">${badgeLabel}</span>
            <span>~${item.timeMin} min read</span>
          </div>
        </div>
        <div class="item-time">📖 ${item.timeMin}m</div>
      </div>`;
  }).join('');

  const exerciseRows = exercises.map(item => {
    const done = isDone(item.id);
    const isDD = item.type === 'deepdive';
    const timeLabel = isDD ? `~${Math.round(item.timeMin/60)}h` : `~${item.timeMin}m`;
    const icon = isDD ? '🗓️' : '⚡';
    return `
      <div class="item-row ${done ? 'done' : ''}" onclick="navigate('item', ${mod.id}, '${item.id}')">
        <div class="item-status ${done ? 'done' : ''}">
          ${done ? '✓' : (isDD ? '🗓' : '⚡')}
        </div>
        <div class="item-info">
          <div class="item-title">${item.title}</div>
          <div class="item-meta">
            <span class="badge ${isDD ? 'b-dd' : 'b-ex'}">${isDD ? 'Deep dive' : 'Mini exercise'}</span>
            <span>${item.description}</span>
          </div>
        </div>
        <div class="item-time">${icon} ${timeLabel}</div>
      </div>`;
  }).join('');

  return `
    <div class="fade-up">
      <div class="module-hdr">
        <button class="back-btn" onclick="navigate('dashboard')">← Dashboard</button>
        <div class="mh-info">
          <h2>${mod.icon} ${mod.title}</h2>
          <p>${mod.subtitle} — ${mp.done}/${mp.total} completed (${mp.pct}%)</p>
        </div>
      </div>
      <div class="items-list">
        <div class="item-row section-divider">📚 Lessons (${lessons.length})</div>
        ${lessonRows}
        <div class="item-row section-divider" style="margin-top:.5rem">🔧 Exercises & Deep Dives (${exercises.length})</div>
        ${exerciseRows}
      </div>
    </div>`;
}


// ════════════════════════════════════════════════════
//  RENDER — ITEM VIEW (LESSON OR EXERCISE)
// ════════════════════════════════════════════════════

function renderItemView(modId, itemId) {
  const mod = CURRICULUM.find(m => m.id === modId);
  if (!mod) return '';
  const item = mod.items.find(i => i.id === itemId);
  if (!item) return '';

  if (item.type === 'lesson') return renderLesson(mod, item);
  return renderExercise(mod, item);
}

function renderLesson(mod, item) {
  const done = isDone(item.id);
  const allItems = mod.items;
  const idx = allItems.indexOf(item);
  const prev = allItems[idx - 1];
  const next = allItems[idx + 1];

  const badgeClass = { 'rust-refresh': 'b-rust', 'new': 'b-new', 'core': 'b-core' }[item.badge] || 'b-core';
  const badgeLabel = { 'rust-refresh': '🔄 Rust Refresh — you may know this', 'new': '🆕 New material', 'core': '⭐ Core concept' }[item.badge] || item.badge;

  const resourcesHTML = item.resources && item.resources.length ? `
    <div class="resources-card">
      <div class="rc-title">📌 Additional Resources</div>
      ${item.resources.map(r => `
        <a href="${r.url}" target="_blank" class="resource-link">
          <span class="rt rt-${r.type}">${r.type}</span>
          <span class="resource-name">${r.title}</span>
        </a>`).join('')}
    </div>` : '';

  return `
    <div class="lesson-wrap fade-up">
      <div class="breadcrumb">
        <span onclick="navigate('dashboard')">Dashboard</span> / 
        <span onclick="navigate('module', ${mod.id})">${mod.title}</span> / 
        ${item.title}
      </div>
      <div class="lesson-card">
        <div class="lesson-type-tag">
          <span class="badge ${badgeClass}">${badgeLabel}</span>
          <span style="margin-left:.5rem">~${item.timeMin} min</span>
        </div>
        <div class="lesson-title">${item.title}</div>
        <div class="lesson-body">${item.content}</div>
      </div>
      ${resourcesHTML}
      <div id="quiz-container"></div>
      <div class="done-bar">
        <p>${done ? '<b>✓ Completed</b> — well done!' : 'Mark this lesson as complete when you\'re ready to move on.'}</p>
        <button class="btn ${done ? 'btn-ghost' : 'btn-primary'} btn-sm" 
          onclick="markItemDone('${item.id}'); this.textContent='✓ Done!'; this.className='btn btn-success btn-sm'; document.querySelector('.done-bar p').innerHTML='<b>✓ Completed</b> — well done!'">
          ${done ? '✓ Completed' : 'Mark Complete'}
        </button>
      </div>
      <div class="footer-nav">
        <button class="btn btn-ghost btn-sm" onclick="navigate('module', ${mod.id})">← Back to module</button>
        ${next ? `<button class="btn btn-primary btn-sm" onclick="navigate('item', ${mod.id}, '${next.id}')">Next: ${next.title.slice(0,30)}… →</button>` : ''}
      </div>
    </div>`;
}

function renderExercise(mod, item) {
  const done = isDone(item.id);
  const isDD = item.type === 'deepdive';
  const allItems = mod.items;
  const idx = allItems.indexOf(item);
  const prev = allItems[idx - 1];
  const next = allItems[idx + 1];

  const timeLabel = isDD ? `~${Math.round(item.timeMin / 60)} hours — save for a focused session` : `~${item.timeMin} minutes`;

  const hintsHTML = item.hints && item.hints.length ? `
    <div class="hints-section">
      ${item.hints.map((hint, i) => `
        <div style="margin-bottom:.4rem">
          <button class="hint-btn" id="hint-btn-${i}" onclick="toggleHint(${i})">💡 Show hint ${i + 1}</button>
          <div class="hint-content" id="hint-content-${i}">${hint}</div>
        </div>`).join('')}
    </div>` : '';

  return `
    <div class="lesson-wrap fade-up">
      <div class="breadcrumb">
        <span onclick="navigate('dashboard')">Dashboard</span> / 
        <span onclick="navigate('module', ${mod.id})">${mod.title}</span> / 
        ${item.title}
      </div>
      <div class="exercise-banner">
        <div class="time-badge ${isDD ? 'deepdive' : 'mini'}">${isDD ? '🗓️' : '⚡'} ${timeLabel}</div>
        <div class="exercise-title">${item.title}</div>
        <div class="exercise-desc">${item.description}</div>
      </div>
      <div class="exercise-card">
        <div class="exercise-body">${item.content}</div>
        ${hintsHTML}
      </div>
      <div class="done-bar">
        <p>${done ? '<b>✓ Completed</b> — great work!' : 'Complete the exercise in your code editor, then mark it done here.'}</p>
        <button class="btn ${done ? 'btn-ghost' : 'btn-primary'} btn-sm"
          onclick="markItemDone('${item.id}'); this.textContent='✓ Done!'; this.className='btn btn-success btn-sm'; document.querySelector('.done-bar p').innerHTML='<b>✓ Completed</b> — great work!'">
          ${done ? '✓ Completed' : 'Mark Complete'}
        </button>
      </div>
      <div class="footer-nav">
        <button class="btn btn-ghost btn-sm" onclick="navigate('module', ${mod.id})">← Back to module</button>
        ${next ? `<button class="btn btn-primary btn-sm" onclick="navigate('item', ${mod.id}, '${next.id}')">Next: ${next.title.slice(0,28)}… →</button>` : ''}
      </div>
    </div>`;
}


// ════════════════════════════════════════════════════
//  MAIN RENDER
// ════════════════════════════════════════════════════

function render() {
  const app = document.getElementById('app');
  if (!app) return;
  if (nav.view === 'dashboard') {
    app.innerHTML = renderDashboard();
  } else if (nav.view === 'module') {
    app.innerHTML = renderModuleView(nav.modId);
  } else if (nav.view === 'item') {
    app.innerHTML = renderItemView(nav.modId, nav.itemId);
    // Initialise quiz if lesson has quiz questions
    const mod = CURRICULUM.find(m => m.id === nav.modId);
    if (mod) {
      const item = mod.items.find(i => i.id === nav.itemId);
      if (item && item.quiz && item.quiz.length) {
        initQuiz(item.quiz, 'quiz-container');
      }
    }
  }
  updateHeader();
}

// ── Boot ────────────────────────────────────────────
render();
</script>
