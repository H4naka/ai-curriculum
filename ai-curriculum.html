<h3>What is red-teaming?</h3>
<p>Red-teaming is the practice of adversarially testing an AI system to find failure modes, safety issues, and harmful capabilities before they are discovered in production. The term comes from military and security practice where a "red team" simulates an adversary's perspective.</p>
<p>For AI systems, red-teaming involves: trying to elicit harmful outputs, testing edge cases, finding failure modes, identifying misuse potential, testing robustness to distribution shift, and stress-testing safety measures.</p>

<h3>Types of AI red-teaming</h3>
<ul>
  <li><strong>Safety red-teaming</strong>: can the model be prompted to produce harmful content (instructions for weapons, dangerous advice, CSAM, discriminatory content)?</li>
  <li><strong>Capability red-teaming</strong>: what can the model do that it was not intended to do? Are there emergent dangerous capabilities?</li>
  <li><strong>Fairness red-teaming</strong>: does the model behave differently for different demographic groups? Does it reproduce stereotypes?</li>
  <li><strong>Robustness red-teaming</strong>: does the model fail on distribution shift, adversarial inputs, unusual formatting, or different languages?</li>
  <li><strong>Privacy red-teaming</strong>: can the model be prompted to reveal training data, PII, or proprietary information (memorisation attacks)?</li>
</ul>

<h3>Structured red-teaming process</h3>
<pre>
# Minimal red-teaming framework for an NLP classification system

class RedTeamingFramework:
    def __init__(self, model_fn, label_names):
        self.model = model_fn
        self.labels = label_names
        self.findings = []

    def test_demographic_consistency(self):
        # Same sentence, different demographic identifiers
        templates = [
            "The {group} person was denied the loan.",
            "The {group} candidate did not get the job.",
            "The {group} patient was discharged early.",
        ]
        groups = ['white', 'Black', 'Asian', 'Hispanic',
                  'male', 'female', 'young', 'elderly']
        for template in templates:
            preds = {}
            for group in groups:
                text = template.format(group=group)
                preds[group] = self.model(text)
            if len(set(str(p) for p in preds.values())) > 1:
                self.findings.append({
                    "type": "demographic_inconsistency",
                    "template": template,
                    "predictions": preds
                })
        return self.findings

    def test_robustness(self, test_cases):
        # Test with typos, different cases, synonyms
        transformations = [
            lambda t: t.upper(),
            lambda t: t.lower(),
            lambda t: t.replace('e', '3').replace('a', '@'),  # 1337-speak
            lambda t: t + '!!!!!',
        ]
        for text, expected_label in test_cases:
            for tfm in transformations:
                modified = tfm(text)
                pred = self.model(modified)
                if pred != expected_label:
                    self.findings.append({
                        "type": "robustness_failure",
                        "original": text,
                        "modified": modified,
                        "expected": expected_label,
                        "got": pred
                    })
        return self.findings
</pre>

<h3>Responsible disclosure</h3>
<p>When you discover a vulnerability or harmful capability in an AI system — whether your own or someone else's — responsible disclosure is the ethical and often legally expected protocol:</p>
<ol>
  <li><strong>Document the finding</strong>: reproduce it consistently, record the exact inputs and outputs</li>
  <li><strong>Assess severity</strong>: how harmful could this be? How easily exploited? How broad is the affected population?</li>
  <li><strong>Contact the responsible party privately first</strong>: give them a reasonable window (30-90 days for critical issues) to address it</li>
  <li><strong>Coordinate on timeline</strong>: agree on a disclosure date; allow time for mitigation</li>
  <li><strong>Public disclosure</strong>: publish findings after the window, with or without a fix, to protect users and advance the field</li>
</ol>

<div class="callout callout-amber"><strong>Your research context</strong>As a researcher who has worked with AI systems, you may encounter concerning findings — a model that behaves unexpectedly, a dataset with undisclosed biases, or a deployed system with a safety gap. Understanding responsible disclosure norms protects you legally, protects affected users, and contributes to the health of the field. Document everything, disclose to responsible parties first, and follow through to public disclosure if not addressed.</div>

<div class="key-takeaways"><h4>Key Takeaways</h4><ul>
  <li>Red-teaming: adversarially test for safety failures, harmful capabilities, fairness issues, and robustness</li>
  <li>Test demographic consistency: same sentence with different group identifiers should get the same prediction</li>
  <li>Responsible disclosure: document, assess severity, contact responsible party privately, give a fix window, then disclose publicly</li>
  <li>For LLMs: test for harmful content generation, privacy leakage, jailbreaks, and demographic biases</li>
</ul></div>`,

<h3>The deployment decision is an ethical decision</h3>
<p>The decision to deploy an ML system is not purely technical. It has ethical weight: deployment means real people will be affected by real predictions, including wrong ones. The question is not "can we deploy?" but "should we deploy, and under what conditions?"</p>

<h3>Criteria that should block deployment</h3>
<ul>
  <li><strong>Unacceptable performance on subgroups</strong>: if any affected demographic group has performance below an agreed threshold — especially for high-stakes decisions</li>
  <li><strong>Unresolved safety issues found in red-teaming</strong>: if the system produces harmful outputs that have not been mitigated</li>
  <li><strong>Missing human oversight mechanisms</strong>: for high-stakes decisions, no fallback mechanism to human review</li>
  <li><strong>Insufficient evaluation coverage</strong>: if the system has not been tested on distributions representative of real-world deployment conditions</li>
  <li><strong>Legal non-compliance</strong>: if GDPR data processing, AI Act conformity, or sector-specific regulations are not met</li>
  <li><strong>Known memorisation of private data</strong>: if the model has been shown to reproduce training data PII</li>
</ul>

<h3>Staged rollout — the responsible deployment pattern</h3>
<p>Rather than binary deploy/don't-deploy, staged rollout distributes risk and builds evidence:</p>
<ol>
  <li><strong>Internal testing</strong>: evaluate on held-out sets, red-team, fairness audit</li>
  <li><strong>Shadow mode</strong>: run the model in production but do not use its outputs; log predictions and compare to human decisions</li>
  <li><strong>Limited rollout</strong>: deploy to 1-5% of traffic; monitor metrics closely</li>
  <li><strong>A/B testing</strong>: compare model decisions to the baseline; measure real-world outcomes</li>
  <li><strong>Gradual rollout</strong>: expand to 20%, 50%, 100% as each stage shows acceptable performance</li>
</ol>

<h3>Monitoring stopping criteria</h3>
<p>Even after deployment, define conditions that trigger automatic rollback:</p>
<pre>
# Example monitoring thresholds
deployment_policy = {
    "max_acceptable_error_rate":          0.05,   # 5%
    "max_subgroup_performance_gap":       0.10,   # 10pp gap between groups
    "max_prediction_drift":               0.15,   # distributional drift
    "min_confidence_for_auto_decision":   0.85,   # below = human review
    "rollback_trigger": {
        "accuracy_drop_threshold":        0.03,   # 3pp drop triggers review
        "fairness_violation_threshold":   0.80,   # below 0.8 ratio triggers rollback
        "incident_count_per_1000":        1       # 1 incident per 1000 triggers review
    }
}
</pre>

<h3>The proportionality principle</h3>
<p>The higher the stakes of a decision, the higher the performance bar and the more robust the human oversight must be. A spam filter failing occasionally is a minor inconvenience. An automated parole decision failing occasionally means a person is unjustly imprisoned. Calibrate your deployment standards to the severity of your worst-case errors.</p>

<div class="callout"><strong>The null hypothesis of deployment</strong>The burden of proof should be on deployment, not on non-deployment. The question to answer before deploying any high-stakes system is not "can you show it causes harm?" but "can you show it does sufficient good with acceptable and controllable risk?" This reversal of the burden of proof is the core of the precautionary principle in AI deployment.</div>

<div class="key-takeaways"><h4>Key Takeaways</h4><ul>
  <li>Deployment is an ethical decision, not just a technical milestone</li>
  <li>Hard blockers: unacceptable subgroup performance, unresolved safety issues, non-compliance, missing human oversight</li>
  <li>Staged rollout: shadow mode → 1-5% → A/B test → gradual expansion</li>
  <li>Define rollback criteria before deployment, not after something goes wrong</li>
</ul></div>`,

<h3>The bias lifecycle</h3>
<p>Bias in ML systems is not a single moment — it accumulates across the full lifecycle from data collection through training, deployment, and feedback loops.</p>

<h3>Pre-existing bias — what's in the data</h3>
<p>Historical data encodes past discrimination. A hiring model trained on past successful employees will reproduce whatever biases led to those hiring decisions. A loan model trained on historical approvals will reproduce redlining and discriminatory lending practices. The model is not creating bias; it is faithfully learning from data that was itself generated by a biased process.</p>

<h3>Technical bias — introduced by the ML process</h3>
<ul>
  <li><strong>Sample bias</strong>: training data is not representative of the deployment population (facial recognition trained on mostly light-skinned faces; speech recognition trained on standard American English)</li>
  <li><strong>Label bias</strong>: labellers bring their own biases (recidivism risk scores reflect racial disparities in policing, not inherent risk)</li>
  <li><strong>Proxy bias</strong>: features that seem neutral encode protected characteristics (zip code encodes race, name encodes gender and ethnicity)</li>
  <li><strong>Evaluation bias</strong>: benchmarks that do not represent the deployment population inflate apparent performance</li>
</ul>

<h3>Emergent bias — caused by deployment context</h3>
<p>A model fair at deployment time may become unfair due to:</p>
<ul>
  <li><strong>Feedback loops</strong>: a recidivism prediction model predicts higher risk for areas with more policing; police more, generate more data showing "higher risk", which justifies more policing. The model amplifies the pattern it was trained on.</li>
  <li><strong>Automation bias</strong>: humans defer to the model even when they would otherwise judge differently, amplifying model errors</li>
  <li><strong>Distribution shift</strong>: the population changes, the model does not, and performance gaps emerge</li>
</ul>

<pre>
# Detecting feedback loop risk in production
class FeedbackLoopDetector:
    def __init__(self, window_size=1000):
        self.history = []
        self.window  = window_size

    def add_outcome(self, prediction, actual_outcome, group):
        self.history.append({
            'prediction':     prediction,
            'outcome':        actual_outcome,
            'group':          group
        })

    def detect_amplification(self):
        import pandas as pd
        df = pd.DataFrame(self.history[-self.window:])
        # Check: are high-prediction groups being targeted more,
        # generating more outcomes that confirm the prediction?
        group_stats = df.groupby('group').agg(
            mean_prediction=('prediction', 'mean'),
            mean_outcome=('outcome', 'mean'),
            count=('prediction', 'count')
        )
        # If mean_prediction and count are correlated per group,
        # a feedback loop may be operating
        corr = group_stats['mean_prediction'].corr(group_stats['count'])
        return {'feedback_loop_risk': corr > 0.7, 'correlation': corr}
</pre>

<h3>Systemic effects — beyond the model</h3>
<p>Individual model fairness does not guarantee systemic fairness. Multiple "fair" models operating together can produce unfair outcomes. A fair resume screening model + fair interview scoring model + fair salary negotiation model can still produce systematically unequal outcomes if historical inequalities are encoded in each step.</p>

<div class="key-takeaways"><h4>Key Takeaways</h4><ul>
  <li>Bias enters at every stage: pre-existing in data, technical in ML process, emergent from deployment context</li>
  <li>Feedback loops: model predictions influence future data, which trains the next model — amplifying initial biases</li>
  <li>Historical data encodes historical discrimination — a model trained on biased history will reproduce that bias</li>
  <li>Systemic fairness requires looking beyond individual models to the entire decision pipeline</li>
</ul></div>`,

      content: `
<h3>Algorithmic Impact Assessment (AIA)</h3>
<p>An AIA is a structured process for evaluating the potential impacts of an automated decision system before deployment. Modelled after environmental impact assessments, it forces systematic consideration of who is affected, what harms are possible, and whether benefits outweigh risks. Required under the EU AI Act for high-risk systems; increasingly adopted voluntarily in responsible tech organisations.</p>

<h3>AIA structure</h3>
<ol>
  <li><strong>System description</strong>: what does the system do? What decisions does it automate or support?</li>
  <li><strong>Stakeholder mapping</strong>: who is affected? Include direct users AND affected third parties</li>
  <li><strong>Data assessment</strong>: what data is used? Who does it represent? What is missing or biased?</li>
  <li><strong>Impact analysis</strong>: enumerate potential harms by stakeholder group and severity</li>
  <li><strong>Alternatives assessment</strong>: is automation the right approach? What are the non-AI alternatives?</li>
  <li><strong>Mitigation measures</strong>: what steps will reduce identified harms?</li>
  <li><strong>Monitoring plan</strong>: how will ongoing harms be detected post-deployment?</li>
  <li><strong>Accountability assignment</strong>: who is responsible for each risk category?</li>
</ol>

<h3>Governance frameworks for ML teams</h3>
<p>Governance is not about bureaucracy — it is about making accountability explicit and creating structures for catching problems before they cause harm. Key elements:</p>
<ul>
  <li><strong>Ethics review board</strong>: independent review for high-stakes AI projects before deployment</li>
  <li><strong>AI incident log</strong>: systematic recording of AI-related incidents, near-misses, and unexpected behaviours</li>
  <li><strong>Model deployment checklist</strong>: mandatory pre-flight checks (fairness audit, red-team, model card, human oversight plan)</li>
  <li><strong>Sunset clauses</strong>: models have defined maximum ages after which they must be re-evaluated against current population data</li>
  <li><strong>Escalation path</strong>: clear process for when engineers encounter ethical concerns they cannot resolve within their team</li>
</ul>

<h3>Your deployment checklist template</h3>
<pre>
# Pre-deployment checklist — version control this document with the model
deployment_checklist = {
    "data_governance": [
        "Training data documented (source, size, date range, known biases)",
        "GDPR lawful basis established for all personal data",
        "Data retention schedule defined",
        "DPIA completed if required"
    ],
    "model_evaluation": [
        "Test set evaluation on held-out representative data",
        "Disaggregated evaluation by relevant demographic groups",
        "Red-team testing completed and findings documented",
        "Performance benchmarked against human baseline or existing system"
    ],
    "documentation": [
        "Model card written and reviewed",
        "Intended and out-of-scope uses documented",
        "Known limitations section complete"
    ],
    "deployment_safeguards": [
        "Human oversight mechanism designed (when does a human review trigger?)",
        "Audit logging enabled (who got what prediction, when)",
        "Rollback plan documented with specific trigger criteria",
        "Incident reporting process established",
        "Monitoring dashboard live"
    ],
    "legal_compliance": [
        "EU AI Act risk tier determined",
        "Sector-specific regulations reviewed",
        "User disclosure mechanism in place if required"
    ]
}

def run_checklist(checklist):
    passed, failed = [], []
    for category, items in checklist.items():
        print(f"\n--- {category.upper()} ---")
        for item in items:
            status = input(f"  [{item}] Complete? (y/n): ")
            (passed if status == 'y' else failed).append(item)
    print(f"\nPassed: {len(passed)} / {len(passed)+len(failed)}")
    if failed:
        print("Blocking items:", failed)
    return len(failed) == 0
</pre>

<div class="key-takeaways"><h4>Key Takeaways</h4><ul>

<pre>
templates = [

}

        for group in groups:
            text = template.format(group=group)
            label, score = predict(text)
            results.append({
                "template": template,
                "category": category,
                "group": group,
                "text": text,
                "label": label,
                "score": score
            })

df = pd.DataFrame(results)

</pre>

<pre>
test_cases = [

    ("Terrible waste of time, avoid at all costs.", "NEGATIVE"),
    ("The performance was outstanding.", "POSITIVE"),

<h3>Objective</h3>
<p>Build a production-quality bias detection library that can be run as part of a CI/CD pipeline — the equivalent of unit tests for fairness. Estimated: 3 hours.</p>

<h3>Step 1 — Core bias detection module</h3>
<pre>
import numpy as np
import pandas as pd
import matplotlib.pyplot as plt
from sklearn.metrics import (confusion_matrix, roc_auc_score,
                              accuracy_score, recall_score,
                              precision_score)
from typing import Dict, List, Optional
import json

class BiasDetector:
    """
    Automated fairness audit tool for binary classification models.
    Computes fairness metrics per group and flags violations.
    """
    SEVERITY_THRESHOLDS = {
        'auc_gap':          0.05,    # > 5pp AUC gap = major
        'fnr_gap':          0.10,    # > 10pp FNR gap = major
        'fpr_gap':          0.10,    # > 10pp FPR gap = major
        'positive_rate_ratio': 0.80, # below 80% = 4/5ths rule violation
    }

    def __init__(self, y_true, y_pred, y_prob, groups, group_names=None):
        self.y_true      = np.array(y_true)
        self.y_pred      = np.array(y_pred)
        self.y_prob      = np.array(y_prob)
        self.groups      = np.array(groups)
        self.group_names = group_names or {g: str(g) for g in np.unique(groups)}
        self.metrics     = {}
        self.violations  = []

    def compute_group_metrics(self):
        """Compute per-group classification metrics."""
        for g in np.unique(self.groups):
            mask = self.groups == g
            yt = self.y_true[mask]
            yp = self.y_pred[mask]
            prob = self.y_prob[mask]
            tn, fp, fn, tp = confusion_matrix(yt, yp, labels=[0,1]).ravel()
            self.metrics[g] = {
                'n':              int(mask.sum()),
                'prevalence':     float(yt.mean()),
                'positive_rate':  float(yp.mean()),
                'accuracy':       float(accuracy_score(yt, yp)),
                'sensitivity':    float(tp/(tp+fn)) if (tp+fn) > 0 else 0.0,
                'specificity':    float(tn/(tn+fp)) if (tn+fp) > 0 else 0.0,
                'fnr':            float(fn/(tp+fn)) if (tp+fn) > 0 else 0.0,
                'fpr':            float(fp/(tn+fp)) if (tn+fp) > 0 else 0.0,
                'ppv':            float(tp/(tp+fp)) if (tp+fp) > 0 else 0.0,
                'auc':            float(roc_auc_score(yt, prob)) if len(np.unique(yt)) > 1 else float('nan')
            }
        return self.metrics

    def detect_violations(self):
        """Flag metrics that exceed the severity thresholds."""
        if not self.metrics:
            self.compute_group_metrics()
        groups = list(self.metrics.keys())
        for metric in ['auc', 'fnr', 'fpr', 'positive_rate']:
            values = {g: self.metrics[g][metric] for g in groups
                      if not np.isnan(self.metrics[g][metric])}
            if len(values) < 2:
                continue
            max_val  = max(values.values())
            min_val  = min(values.values())
            gap      = max_val - min_val
            ratio    = min_val / max_val if max_val > 0 else 1.0
            thresh   = self.SEVERITY_THRESHOLDS.get(metric + '_gap',
                       self.SEVERITY_THRESHOLDS.get(metric + '_ratio', 999))
            if gap > thresh or ratio < self.SEVERITY_THRESHOLDS.get('positive_rate_ratio', 0.8):
                self.violations.append({
                    'metric':    metric,
                    'gap':       round(gap, 4),
                    'ratio':     round(ratio, 4),
                    'max_group': max(values, key=values.get),
                    'min_group': min(values, key=values.get),
                    'severity':  'major' if gap > thresh * 1.5 else 'moderate'
                })
        return self.violations

    def report(self, title="Fairness Audit Report"):
        """Generate a structured text report."""
        if not self.metrics:
            self.compute_group_metrics()
        if not self.violations:
            self.detect_violations()
        lines = [f"{'='*60}", f"{title}", f"{'='*60}"]
        lines.append("\nPER-GROUP METRICS")
        df = pd.DataFrame(self.metrics).T
        lines.append(df[['n','prevalence','positive_rate',
                          'sensitivity','specificity','fnr','fpr','auc']
                        ].round(3).to_string())
        lines.append(f"\nVIOLATIONS FOUND: {len(self.violations)}")
        for v in self.violations:
            lines.append(f"  [{v['severity'].upper()}] {v['metric']}: "
                         f"gap={v['gap']}, ratio={v['ratio']} "
                         f"({v['min_group']} vs {v['max_group']})")
        if not self.violations:
            lines.append("  No violations detected above threshold.")
        return '\n'.join(lines)

    def plot(self, title="Bias Audit"):
        """Visualise group metrics as grouped bar chart."""
        if not self.metrics:
            self.compute_group_metrics()
        df  = pd.DataFrame(self.metrics).T
        metrics_to_plot = ['sensitivity', 'specificity', 'fnr', 'fpr']
        fig, axes = plt.subplots(1, 4, figsize=(16, 5))
        fig.suptitle(title)
        for ax, metric in zip(axes, metrics_to_plot):
            colors = ['tomato' if v < 0.6 else 'steelblue'
                      for v in df[metric]]
            ax.bar(df.index.astype(str), df[metric], color=colors)
            ax.set_title(metric); ax.set_ylim(0, 1)
            ax.axhline(df[metric].mean(), color='k', linestyle='--', linewidth=1)
        plt.tight_layout(); plt.show()

<h3>What MLOps is and why it exists</h3>
<p>MLOps (Machine Learning Operations) is the set of practices, tools, and culture that bridges the gap between a working ML model and a reliable, maintainable production system. It borrows from DevOps but adds the unique challenges of ML: non-determinism, data dependencies, statistical performance metrics, and model degradation over time.</p>
<p>The core problem: a Jupyter notebook that achieves 94% accuracy is the <em>beginning</em> of the work, not the end. Getting that model to reliably serve predictions to millions of users, know when it is degrading, and be safely updated — that is MLOps.</p>

<h3>The hidden technical debt in ML systems</h3>
<p>Sculley et al. (2015) — the "hidden technical debt" paper from Google — identified that only a small fraction of production ML code is actual model code. The surrounding infrastructure is enormous:</p>
<ul>
  <li><strong>Data collection and validation</strong>: pipelines to ingest, validate, and transform data</li>
  <li><strong>Feature engineering</strong>: consistent, versioned, low-latency feature computation</li>
  <li><strong>Model training infrastructure</strong>: reproducible, scheduled, monitored training runs</li>
  <li><strong>Model evaluation and validation</strong>: automated testing before promotion to production</li>
  <li><strong>Serving infrastructure</strong>: low-latency, highly available prediction endpoints</li>
  <li><strong>Monitoring</strong>: detecting when the model or data drifts from what it was trained on</li>
</ul>

<h3>The MLOps maturity spectrum</h3>
<ul>
  <li><strong>Level 0</strong>: manual process. Notebooks, manual training, manual deployment. Fine for experimentation.</li>
  <li><strong>Level 1</strong>: ML pipeline automation. Automated training and evaluation pipelines. Model registry. Basic monitoring.</li>
  <li><strong>Level 2</strong>: CI/CD for ML pipelines. Automated testing of data, models, and serving code. Triggered retraining. The standard for production systems.</li>

<h3>The reproducibility crisis in ML</h3>
<p>Without tracking, ML experiments are like cooking without a recipe: you might produce something great, but you cannot reproduce it. Common problems: "which hyperparameters produced the best model last week?", "which version of the training data did we use for model v3?", "what was the exact preprocessing pipeline for this deployed model?"</p>
<p>Experiment tracking tools solve this by logging everything — parameters, metrics, artefacts, and code versions — for every run.</p>

<h3>MLflow — the open-source standard</h3>
<pre>
# pip install mlflow

import mlflow
import mlflow.sklearn
import numpy as np
from sklearn.ensemble import GradientBoostingClassifier
from sklearn.datasets import load_breast_cancer
from sklearn.model_selection import train_test_split
from sklearn.metrics import roc_auc_score, accuracy_score

data = load_breast_cancer()
X_tr, X_te, y_tr, y_te = train_test_split(
    data.data, data.target, test_size=0.2, random_state=42)

# Start an experiment — all runs belong to a named experiment
mlflow.set_experiment("breast-cancer-classification")

# Track a training run
with mlflow.start_run(run_name="gbm_baseline"):

    # Log hyperparameters
    params = {"n_estimators": 200, "max_depth": 3,
              "learning_rate": 0.05, "subsample": 0.8}
    mlflow.log_params(params)

    # Train
    model = GradientBoostingClassifier(**params, random_state=42)
    model.fit(X_tr, y_tr)

    # Log metrics
    train_auc = roc_auc_score(y_tr, model.predict_proba(X_tr)[:, 1])
    test_auc  = roc_auc_score(y_te, model.predict_proba(X_te)[:, 1])
    mlflow.log_metric("train_auc", train_auc)
    mlflow.log_metric("test_auc",  test_auc)
    mlflow.log_metric("test_acc",  accuracy_score(y_te, model.predict(X_te)))

    # Log model artefact (saves model file + signature)
    from mlflow.models.signature import infer_signature
    signature = infer_signature(X_tr, model.predict(X_tr))
    mlflow.sklearn.log_model(model, "model", signature=signature,
                              registered_model_name="BreastCancerClassifier")

    # Log any file (plots, config, etc.)
    import matplotlib.pyplot as plt
    fig, ax = plt.subplots()
    ax.bar(data.feature_names[:10],
           model.feature_importances_[:10])
    ax.set_title("Feature Importances")
    fig.savefig("feature_importance.png", dpi=100, bbox_inches='tight')
    mlflow.log_artifact("feature_importance.png")
    plt.close()

print(f"Run complete. Test AUC: {test_auc:.4f}")

# Launch the tracking UI:
# mlflow ui --port 5000
# Then open http://localhost:5000

<h3>Why model versioning is essential</h3>
<p>In production, a model is not a single file — it is a versioned artefact with a lifecycle. You need to: promote a new version to production, roll back to a previous version if something breaks, run multiple versions in parallel (A/B test), audit which version made which prediction, and know which training run produced each version. A model registry is the system that manages this lifecycle.</p>

<h3>MLflow Model Registry — lifecycle management</h3>
<pre>
import mlflow
from mlflow.tracking import MlflowClient

client = MlflowClient()

# ── Registering a model ───────────────────────────────────────────────────
# After training, register the model (done automatically with registered_model_name above)
# Or manually:
run_id = "abc123def456"   # from mlflow.start_run()
model_uri = f"runs:/{run_id}/model"
mv = mlflow.register_model(model_uri, "BreastCancerClassifier")
print(f"Registered model version: {mv.version}")

# ── Staging → Production promotion lifecycle ──────────────────────────────
# Move a version to Staging (for testing)
client.transition_model_version_stage(
    name="BreastCancerClassifier",
    version=mv.version,
    stage="Staging"
)

# After validation, promote to Production
client.transition_model_version_stage(
    name="BreastCancerClassifier",
    version=mv.version,
    stage="Production"
)

# Archive old version when new one is deployed
client.transition_model_version_stage(
    name="BreastCancerClassifier",
    version=str(int(mv.version) - 1),
    stage="Archived"
)

# ── Loading the production model ──────────────────────────────────────────
# Always load by stage, not by version number — this decouples serving code from training
production_model = mlflow.sklearn.load_model(
    "models:/BreastCancerClassifier/Production"
)
predictions = production_model.predict(X_te)

# ── Listing all versions ──────────────────────────────────────────────────
for mv in client.search_model_versions("name='BreastCancerClassifier'"):
    print(f"Version: {mv.version}, Stage: {mv.current_stage}, "
          f"Run ID: {mv.run_id}")

<h3>Semantic versioning for ML models</h3>
<p>Borrow from software versioning:</p>
<ul>
  <li><strong>Major version</strong> (v2.0): breaking change to input/output schema; downstream consumers must update</li>

<h3>Why FastAPI for ML serving</h3>
<p>FastAPI is the standard for production ML serving in Python. It provides: automatic request validation via Pydantic models, auto-generated OpenAPI/Swagger documentation, async support for high throughput, and excellent performance (one of the fastest Python frameworks). Understanding how to build a clean serving API is a core MLOps skill.</p>

<h3>A production-quality serving endpoint</h3>
<pre>
# app.py — run with: uvicorn app:app --host 0.0.0.0 --port 8000
# pip install fastapi uvicorn pydantic mlflow scikit-learn

from fastapi import FastAPI, HTTPException
from pydantic import BaseModel, Field
from typing import List
import mlflow.sklearn
import numpy as np
import logging
import time

# ── Configuration ─────────────────────────────────────────────────────────
logging.basicConfig(level=logging.INFO)
logger = logging.getLogger(__name__)

app = FastAPI(
    title="Cancer Risk Classifier",
    description="Predicts malignancy probability from biopsy features.",
    version="1.0.0"
)

# ── Load model at startup — not on each request ────────────────────────────
model = None

@app.on_event("startup")
async def load_model():
    global model
    try:
        model = mlflow.sklearn.load_model("models:/BreastCancerClassifier/Production")
        logger.info("Model loaded successfully")
    except Exception as e:
        logger.error(f"Failed to load model: {e}")
        raise

# ── Request and response schemas ──────────────────────────────────────────
class PredictionRequest(BaseModel):
    features: List[float] = Field(
        ...,
        min_items=30, max_items=30,
        description="30 biopsy feature values in the standard order"
    )
    patient_id: str = Field(..., description="De-identified patient ID for audit logging")

class PredictionResponse(BaseModel):
    patient_id: str
    malignant_probability: float = Field(ge=0.0, le=1.0)
    prediction: str               # "malignant" or "benign"
    confidence: str               # "high", "medium", "low"
    model_version: str

# ── Endpoints ─────────────────────────────────────────────────────────────
@app.get("/health")
async def health_check():
    return {"status": "healthy", "model_loaded": model is not None}

@app.post("/predict", response_model=PredictionResponse)
async def predict(request: PredictionRequest):
    if model is None:
        raise HTTPException(status_code=503, detail="Model not loaded")

    start_time = time.time()
    X = np.array(request.features).reshape(1, -1)

    try:
        prob = float(model.predict_proba(X)[0, 1])
    except Exception as e:
        logger.error(f"Prediction error for {request.patient_id}: {e}")
        raise HTTPException(status_code=500, detail="Prediction failed")

    prediction = "malignant" if prob >= 0.4 else "benign"  # lower threshold for safety
    confidence = "high" if (prob > 0.8 or prob < 0.2) else (
                 "medium" if (prob > 0.6 or prob < 0.4) else "low")

    latency = (time.time() - start_time) * 1000
    logger.info(
        f"patient={request.patient_id} prob={prob:.3f} "
        f"pred={prediction} latency={latency:.1f}ms"
    )

    return PredictionResponse(
        patient_id=request.patient_id,
        malignant_probability=round(prob, 4),
        prediction=prediction,
        confidence=confidence,
        model_version="1.0.0"
    )

@app.post("/predict/batch", response_model=List[PredictionResponse])
async def predict_batch(requests: List[PredictionRequest]):
    """Batch prediction endpoint for throughput-critical workloads."""
    if model is None:
        raise HTTPException(status_code=503, detail="Model not loaded")
    X = np.array([r.features for r in requests])
    probs = model.predict_proba(X)[:, 1]
    return [
        PredictionResponse(
            patient_id=req.patient_id,
            malignant_probability=round(float(prob), 4),
            prediction="malignant" if prob >= 0.4 else "benign",
            confidence="high" if (prob > 0.8 or prob < 0.2) else "medium",
            model_version="1.0.0"
        )
        for req, prob in zip(requests, probs)
    ]

<p>The classic problem: "it works on my machine." Docker packages your model, dependencies, and environment into a container that runs identically everywhere — your laptop, a cloud VM, or a Kubernetes cluster. For ML specifically, this solves: dependency version conflicts between projects, Python/CUDA version mismatches, and the "works in dev but not prod" problem.</p>

<h3>A production Dockerfile for an ML serving API</h3>
<pre>
# Dockerfile

# Use an official Python runtime as base image
# Pin the exact version for reproducibility

# Set working directory

# Install system dependencies first (layer cached separately from Python deps)
RUN apt-get update && apt-get install -y \\
    gcc \\
    && rm -rf /var/lib/apt/lists/*

# Copy requirements and install Python dependencies
# BEFORE copying application code — better layer caching
COPY requirements.txt .
RUN pip install --no-cache-dir -r requirements.txt

# Copy application code
COPY app.py .
COPY model/ ./model/

# Create non-root user for security
RUN useradd -m appuser
USER appuser

# Expose port
EXPOSE 8000

# Health check — Docker will mark container unhealthy if this fails
HEALTHCHECK --interval=30s --timeout=10s --retries=3 \\
    CMD curl -f http://localhost:8000/health || exit 1

# Start the server
CMD ["uvicorn", "app:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]

<h3>What CI/CD means for ML</h3>
<p>Continuous Integration (CI) runs automated tests on every code change. Continuous Deployment (CD) automatically deploys verified changes to production. For ML, this extends to: testing data pipelines, validating model performance thresholds, running fairness checks, and only promoting models that meet all criteria — automatically.</p>

<h3>A GitHub Actions CI/CD pipeline for ML</h3>
<pre>

    branches: [main]
  pull_request:
    branches: [main]

    - cron: "0 2 * * 1"   # Retrain every Monday at 2am

      - name: Run data validation tests

<h3>Model evaluation gate — the quality threshold script</h3>
<pre>
# evaluate.py — used as a deployment gate
import argparse
import mlflow
import sys

def main():
    parser = argparse.ArgumentParser()
    parser.add_argument("--min-auc", type=float, default=0.90)
    parser.add_argument("--max-fnr", type=float, default=0.10)
    args = parser.parse_args()

    # Find the latest run
    runs = mlflow.search_runs(order_by=["start_time DESC"])
    latest = runs.iloc[0]

    auc = latest["metrics.test_auc"]
    fnr = latest["metrics.test_fnr"]

    print(f"Test AUC: {auc:.4f} (threshold: {args.min_auc})")
    print(f"Test FNR: {fnr:.4f} (threshold: {args.max_fnr})")

    if auc < args.min_auc:
        print(f"FAILED: AUC {auc:.4f} < {args.min_auc}")
        sys.exit(1)
    if fnr > args.max_fnr:
        print(f"FAILED: FNR {fnr:.4f} > {args.max_fnr}")
        sys.exit(1)

    print("All thresholds met. Proceeding with deployment.")
    sys.exit(0)

if __name__ == "__main__":
    main()

<h3>What can go wrong after deployment</h3>
<p>Deploying a model is not the end of the work — it is the beginning of monitoring. Three things degrade model performance in production:</p>
<ul>
  <li><strong>Data drift</strong>: the distribution of input features changes from what the model was trained on</li>
  <li><strong>Concept drift</strong>: the relationship between features and the target changes (even if features look the same)</li>
  <li><strong>Upstream data issues</strong>: a pipeline change causes a feature to be computed differently, or a field starts being null</li>
</ul>

<h3>Monitoring with Evidently AI</h3>
<pre>

import numpy as np
import pandas as pd
from evidently.report import Report
from evidently.metric_preset import DataDriftPreset, ClassificationPreset

    "age":              np.random.randn(500),
    "income":           np.random.randn(500) + 1.5,    # mean shifted by 1.5
    "credit_score":     np.random.randn(500) * 1.8,    # variance increased
    "loan_amount":      np.random.randn(500),
    "employment_years": np.random.randn(500),
})

# Data drift report
report = Report(metrics=[
    DatasetDriftMetric(),      # overall drift verdict
    DataDriftTable(),          # per-feature drift statistics
    ColumnDriftMetric(column_name="income"),
    ColumnDriftMetric(column_name="credit_score"),

report.run(reference_data=reference, current_data=current)

# Check drift programmatically

<h3>Statistical drift tests</h3>
<ul>
  <li><strong>Kolmogorov-Smirnov (KS) test</strong>: tests whether two distributions come from the same continuous distribution. p-value &lt; 0.05 = drift detected. Evidently uses this by default for continuous features.</li>
  <li><strong>Population Stability Index (PSI)</strong>: measures distribution shift on a scale: PSI &lt; 0.1 (stable), 0.1-0.2 (moderate), &gt; 0.2 (significant drift). Used in financial risk modelling.</li>
  <li><strong>Chi-squared test</strong>: for categorical features. Tests whether category frequencies have changed.</li>
</ul>
<pre>
from scipy.stats import ks_2samp

def detect_drift(reference_col, current_col, threshold=0.05):
    statistic, p_value = ks_2samp(reference_col, current_col)
    return {
        "drifted": p_value < threshold,

<p>For many real-world problems (fraud, churn, loan default), ground truth labels arrive days or weeks after the prediction. In this window, you cannot compute accuracy directly. Instead, monitor:</p>

  <li><strong>Feature distributions</strong>: statistical tests per feature vs training reference</li>

def monitor_prediction_distribution(reference_probs, current_probs):

    ref_mean  = np.mean(reference_probs)
    curr_mean = np.mean(current_probs)

<h3>The feature consistency problem</h3>
<p>Imagine you train a fraud model using a feature "transactions in the last 7 days." To compute this during training, you write a Python script. To compute it in production, you write a different function — in a different language, on a different platform. If these two implementations diverge, your model's training and serving environments are inconsistent. This is called the <strong>training-serving skew</strong> problem and it is one of the most common sources of silent performance degradation in production ML systems.</p>

<h3>What a feature store solves</h3>
<p>A feature store is a centralised platform for storing, computing, and serving ML features. It provides:</p>
<ul>
  <li><strong>Feature reuse</strong>: define once, use in any model's training or serving</li>
  <li><strong>Consistency</strong>: same code computes features for training and serving</li>
  <li><strong>Time-travel</strong>: retrieve features as they were at any point in the past (prevents leakage and enables debugging)</li>
  <li><strong>Low-latency serving</strong>: pre-computed features in an online store (Redis, DynamoDB) for real-time prediction</li>
</ul>

<h3>Feast — the open-source feature store</h3>
<pre>

# feature_repo/feature_store.yaml

<h3>Why A/B test ML models</h3>
<p>Offline metrics (AUC, accuracy) tell you how a model performs on historical data. But what you care about is real-world impact. A new recommendation model with better offline metrics might produce worse user engagement due to filter bubble effects. A/B testing measures what actually matters by comparing model variants on real users.</p>

<h3>The A/B testing setup</h3>
<pre>
import hashlib
import numpy as np
import pandas as pd
from typing import Dict, Any

class ModelABRouter:
    """
    Routes prediction requests to model variants based on user ID hash.
    Ensures the same user always gets the same variant (sticky assignment).
    """
    def __init__(self, variants: Dict[str, Any], split: Dict[str, float]):
        """
        variants: {"control": model_a, "treatment": model_b}
        split:    {"control": 0.5, "treatment": 0.5}
        """
        assert abs(sum(split.values()) - 1.0) < 1e-6, "Split must sum to 1"
        self.variants = variants
        self.split    = split
        self.log      = []

    def get_variant(self, user_id: str) -> str:
        """Deterministic assignment: same user_id always gets same variant."""
        hash_val  = int(hashlib.md5(user_id.encode()).hexdigest(), 16)
        bucket    = (hash_val % 100) / 100.0   # bucket in [0, 1)
        cumulative = 0.0
        for variant, proportion in self.split.items():
            cumulative += proportion
            if bucket < cumulative:
                return variant
        return list(self.split.keys())[-1]

    def predict(self, user_id: str, features: np.ndarray) -> Dict:
        variant  = self.get_variant(user_id)
        model    = self.variants[variant]
        prob     = float(model.predict_proba(features.reshape(1, -1))[0, 1])
        self.log.append({"user_id": user_id, "variant": variant, "prob": prob})
        return {"variant": variant, "probability": prob}

# Usage
router = ModelABRouter(
    variants={"control": model_v1, "treatment": model_v2},
    split={"control": 0.50, "treatment": 0.50}
)

for user_id in ["user_001", "user_002", "user_003"]:
    result = router.predict(user_id, X_te[0])
    print(f"{user_id} -> {result['variant']} ({result['probability']:.3f})")
</pre>

<h3>Key A/B testing pitfalls</h3>
<ul>
  <li><strong>Peeking</strong>: stopping the test early when you see significance — inflates false positive rate. Define stopping criteria before starting.</li>
  <li><strong>Multiple comparisons</strong>: testing many metrics inflates chance of false positives. Choose one primary metric before starting.</li>
  <li><strong>Network effects</strong>: if users interact with each other, control and treatment bleed into each other (social networks, marketplaces)</li>
  <li><strong>Novelty effect</strong>: users engage more with anything new. Run tests long enough (typically 1-2 weeks minimum) to see stable behaviour.</li>
</ul>

<h3>Choosing the right serving architecture</h3>
<p>Not all ML workloads are the same. A recommendation engine for millions of real-time users has completely different requirements from a nightly batch scoring job. Here are the main patterns and when to use each.</p>

<h3>Pattern 1 — Synchronous REST API</h3>
<p>Request → API → Model → Response in real time. Latency: 1-100ms. Use when: decisions must be made in real time (fraud detection, ad targeting, search ranking). The FastAPI approach from Lesson 4.</p>

<h3>Pattern 2 — Batch inference</h3>
<p>Score an entire dataset at once, store results. Latency: minutes to hours. Use when: decisions do not need to be real-time (risk scoring overnight, personalisation updated daily).</p>
<pre>
# Batch inference with pandas and joblib
import pandas as pd
import joblib
import numpy as np

def run_batch_inference(input_path, output_path, model_path):
    model = joblib.load(model_path)
    chunks = pd.read_csv(input_path, chunksize=10000)  # process in chunks
    all_preds = []

    for i, chunk in enumerate(chunks):
        probs = model.predict_proba(chunk.values)[:, 1]
        chunk["risk_score"] = probs
        chunk["risk_tier"]  = pd.cut(probs, bins=[0,.3,.6,.8,1],
                                      labels=["low","medium","high","critical"])
        all_preds.append(chunk)
        print(f"Processed chunk {i+1}")

    pd.concat(all_preds).to_parquet(output_path, index=False)
    print(f"Saved to {output_path}")
</pre>

<h3>Pattern 3 — Async / Queue-based inference</h3>
<p>Request goes into a queue; worker processes it; result is retrieved by polling or callback. Latency: seconds to minutes. Use when: model is slow (large neural network) and real-time response is not required.</p>

<h3>Pattern 4 — Embedded inference</h3>
<p>Model runs on the device (mobile, browser, edge). No network round-trip. Use when: low latency, offline capability, or privacy (data stays on device). ONNX or TFLite are common formats.</p>
<pre>
# Export a sklearn model to ONNX for edge deployment
from skl2onnx import convert_sklearn
from skl2onnx.common.data_types import FloatTensorType

initial_type = [("float_input", FloatTensorType([None, X.shape[1]]))]
onnx_model   = convert_sklearn(model, initial_types=initial_type)

with open("model.onnx", "wb") as f:
    f.write(onnx_model.SerializeToString())

# Load and run with ONNX Runtime (fast, cross-platform)

sess  = rt.InferenceSession("model.onnx")
input_name  = sess.get_inputs()[0].name
output_name = sess.get_outputs()[0].name
predictions = sess.run([output_name],
                        {input_name: X_te.astype(np.float32)})[0]
</pre>

<h3>Scalability considerations</h3>
<ul>
  <li><strong>Horizontal scaling</strong>: run multiple container replicas behind a load balancer. Stateless APIs scale easily.</li>
  <li><strong>Caching</strong>: if the same inputs recur (same user profile, same product), cache predictions in Redis. Can reduce model calls by 50-90%.</li>
  <li><strong>Model quantisation</strong>: 8-bit or 4-bit weights reduce memory and increase throughput on CPU inference. PyTorch: torch.quantization.</li>
  <li><strong>Batching in the serving layer</strong>: if individual requests arrive faster than the model can process them, batch them in the serving layer before calling the model.</li>
</ul>

<div class="key-takeaways"><h4>Key Takeaways</h4><ul>
  <li>Synchronous REST: real-time decisions (fraud, ranking). Latency &lt; 100ms.</li>
  <li>Batch: offline scoring of large datasets. Latency: minutes to hours.</li>
  <li>Queue-based: slow models where async is acceptable. Latency: seconds to minutes.</li>
  <li>ONNX enables model deployment to edge devices without Python runtime dependency</li>

from statsmodels.stats.power import GofChisquarePower, TTestIndPower

# New model: we expect 6% (20% relative improvement)

target_rate   = 0.06

# 80% power, 5% significance level (two-tailed)
from statsmodels.stats.power import NormalIndPower
analysis  = NormalIndPower()
n_per_group = analysis.solve_power(
    effect_size=effect_size,
    power=0.80,
    alpha=0.05,
    alternative="two-sided"
)
print(f"Required sample size per group: {int(np.ceil(n_per_group))}")

print(f"Treatment conversion: {treatment_rate:.4f}")

<h3>Tasks — implement the batch inference pipeline</h3>
<pre>
def run_batch_inference(
    input_path: str,
    output_path: str,
    model_path: str,
    chunk_size: int = 10_000,
    threshold: float = 0.4
) -> dict:
    """
    Run batch inference on a large dataset.

    Returns a summary dict with: total records, high risk count,
    processing time, records per second.
    """
    model     = joblib.load(model_path)
    feature_cols = load_breast_cancer().feature_names.tolist()
    start_time   = time.time()
    results      = []

    reader = pd.read_parquet(input_path)
    n_chunks = (len(reader) // chunk_size) + 1

    for chunk_idx in range(n_chunks):
        start = chunk_idx * chunk_size
        end   = min(start + chunk_size, len(reader))
        if start >= len(reader):
            break

        chunk = reader.iloc[start:end]
        X     = chunk[feature_cols].values
        probs = model.predict_proba(X)[:, 1]

        result_chunk = pd.DataFrame({
            "patient_id":        chunk["patient_id"].values,
            "malignant_prob":    probs.round(4),
            "risk_tier":         pd.cut(probs, bins=[0, 0.3, 0.6, 0.8, 1.0],
                                         labels=["low","medium","high","critical"])
                                   .astype(str),
            "flag_for_review":   probs >= threshold
        })
        results.append(result_chunk)

        if (chunk_idx + 1) % 5 == 0:
            logger.info(f"Processed {end:,} / {len(reader):,} records")

    output = pd.concat(results, ignore_index=True)
    output.to_parquet(output_path, index=False)

    elapsed = time.time() - start_time
    summary = {
        "total_records":   len(output),
        "high_risk_count": int(output["flag_for_review"].sum()),
        "high_risk_rate":  float(output["flag_for_review"].mean()),
        "elapsed_seconds": round(elapsed, 2),
        "records_per_sec": round(len(output) / elapsed)
    }
    logger.info(f"Batch complete: {summary}")
    return summary

summary = run_batch_inference(
    "input_data.parquet",
    "predictions.parquet",
    "batch_model.joblib"
)

<pre>
# train.py
import argparse
import mlflow
import mlflow.sklearn
import numpy as np
from sklearn.ensemble import GradientBoostingClassifier
from sklearn.datasets import load_breast_cancer
from sklearn.model_selection import train_test_split
from sklearn.metrics import roc_auc_score, accuracy_score
from sklearn.pipeline import Pipeline
from sklearn.preprocessing import StandardScaler
from sklearn.calibration import CalibratedClassifierCV
import json

def train(n_estimators=200, learning_rate=0.05, max_depth=3,
           experiment_name="production-classifier"):
    mlflow.set_experiment(experiment_name)

    data = load_breast_cancer()
    X_tr, X_te, y_tr, y_te = train_test_split(
        data.data, data.target, test_size=0.2, random_state=42, stratify=data.target)

    with mlflow.start_run():
        params = {"n_estimators": n_estimators, "learning_rate": learning_rate,
                  "max_depth": max_depth, "data_version": "v1.0"}
        mlflow.log_params(params)

        # Train with calibration for reliable probabilities
        base = GradientBoostingClassifier(
            n_estimators=n_estimators, learning_rate=learning_rate,
            max_depth=max_depth, random_state=42)
        model = CalibratedClassifierCV(base, cv=3, method="isotonic")
        model.fit(X_tr, y_tr)

        # Metrics
        test_auc  = roc_auc_score(y_te, model.predict_proba(X_te)[:,1])
        test_acc  = accuracy_score(y_te, model.predict(X_te))
        y_prob_tr = model.predict_proba(X_tr)[:,1]
        train_auc = roc_auc_score(y_tr, y_prob_tr)

        mlflow.log_metric("train_auc", round(train_auc, 4))
        mlflow.log_metric("test_auc",  round(test_auc, 4))
        mlflow.log_metric("test_acc",  round(test_acc, 4))

        # Log model to registry
        mlflow.sklearn.log_model(
            model, "model",
            registered_model_name="CancerClassifier"
        )

        # Save reference statistics for monitoring
        ref_stats = {
            "feature_means": data.data.mean(axis=0).tolist(),
            "feature_stds":  data.data.std(axis=0).tolist(),
            "feature_names": data.feature_names.tolist(),
            "baseline_auc":  round(test_auc, 4)
        }
        with open("reference_stats.json", "w") as f:
            json.dump(ref_stats, f)
        mlflow.log_artifact("reference_stats.json")

        print(f"Training complete. Test AUC: {test_auc:.4f}")
        return mlflow.active_run().info.run_id

if __name__ == "__main__":
    parser = argparse.ArgumentParser()
    parser.add_argument("--n-estimators",  type=int,   default=200)
    parser.add_argument("--learning-rate", type=float, default=0.05)
    parser.add_argument("--max-depth",     type=int,   default=3)
    args = parser.parse_args()
    train(args.n_estimators, args.learning_rate, args.max_depth)

# monitor.py — run periodically (every hour in production)
import requests
import json
import numpy as np
import pandas as pd
from scipy.stats import ks_2samp
from datetime import datetime

class ProductionMonitor:
    def __init__(self, api_url, reference_stats_path):
        self.api_url  = api_url
        with open(reference_stats_path) as f:
            self.ref_stats = json.load(f)
        self.alerts = []

    def check_drift(self, production_data: pd.DataFrame):
        """Compare current feature distributions to training reference."""
        for i, col in enumerate(self.ref_stats["feature_names"]):
            ref_sample = np.random.normal(
                self.ref_stats["feature_means"][i],
                self.ref_stats["feature_stds"][i],
                1000
            )
            curr_col = production_data[col].dropna()
            _, p_val = ks_2samp(ref_sample, curr_col)
            if p_val < 0.05:
                self.alerts.append({
                    "type":      "data_drift",
                    "feature":   col,
                    "p_value":   round(p_val, 4),
                    "timestamp": datetime.now().isoformat()
                })

    def check_prediction_distribution(self, probs):
        """Alert if prediction mean shifts by more than 10pp from baseline."""
        curr_mean = np.mean(probs)
        # Approximate baseline mean from a calibrated model on balanced data
        baseline_mean = 0.37   # known from training prevalence
        if abs(curr_mean - baseline_mean) > 0.10:
            self.alerts.append({
                "type":           "prediction_drift",
                "current_mean":   round(curr_mean, 4),
                "baseline_mean":  baseline_mean,
                "timestamp":      datetime.now().isoformat()
            })

    def report(self):
        print(f"Monitoring report: {datetime.now().isoformat()}")
        print(f"Total alerts: {len(self.alerts)}")
        for a in self.alerts:
            print(f"  [{a['type']}] {json.dumps({k:v for k,v in a.items() if k != 'type'})}")
        return self.alerts

<h3>Why Git for ML is different</h3>
<p>Standard software version control tracks code. ML projects additionally need to track: datasets (too large for Git), model weights (binary, gigabytes), experiments (hyperparameters, metrics, artefacts), and the relationship between all of these. A commit hash alone does not tell you which data version, model version, and experiment produced a result.</p>

<h3>The ML-specific Git workflow</h3>
<pre>
# Standard feature branch workflow adapted for ML
git checkout -b experiment/gbm-learning-rate-sweep

# Make changes: update training script, config, etc.
git add train.py config.yaml
git commit -m "feat: sweep lr in [0.01, 0.05, 0.1] for GBM baseline

- Add lr sweep to train.py
- Log all runs to MLflow experiment 'gbm-lr-sweep'
- Best run ID: abc123 (lr=0.05, AUC=0.934)"

# Never commit: large data files, model weights, API keys
# .gitignore should include:
# data/raw/         # raw datasets
# models/           # saved model weights
# mlruns/           # MLflow tracking files (use remote tracking server)
# .env              # environment variables / secrets
# __pycache__/

<h3>Git LFS — for medium-sized binary files</h3>
<pre>

# stores the actual content on a remote LFS server
# Use for: model weights, processed datasets, plots under ~100MB

git lfs install

git lfs track "*.pt"          # PyTorch checkpoints
git lfs track "*.parquet"     # processed data files
git lfs track "data/processed/**"

git add .gitattributes
git commit -m "chore: configure Git LFS for model and data files"

# After this, git add model.joblib adds a pointer, not the actual file
# The actual file is stored on the LFS server
</pre>

<h3>DVC — Data Version Control</h3>
<p>DVC extends Git to version datasets and ML pipelines. It stores data in a remote (S3, GCS, Azure, local) and keeps lightweight pointer files in Git. The pointer files encode the exact data version, so any commit can reproduce the exact dataset used.</p>
<pre>

dvc add data/train.csv
# This creates data/train.csv.dvc (a pointer file — commit THIS to Git)
# and adds data/train.csv to .gitignore

git add data/train.csv.dvc .gitignore
git commit -m "data: add training dataset v1.0"

# Push data to remote storage
dvc push

# On another machine: reproduce the exact data
git pull
dvc pull     # downloads the data file corresponding to the current commit

<h3>The reproducibility crisis in ML</h3>
<p>A 2019 survey found that over 50% of ML papers could not be reproduced by independent researchers. In production, this means: "we cannot rebuild the model that is currently running," which is both an engineering risk and a regulatory problem. Reproducibility is not an academic nicety — it is an operational requirement.</p>

<h3>The five pillars of reproducibility</h3>
<ul>
  <li><strong>Code version</strong>: the exact code that produced a result (Git commit hash)</li>
  <li><strong>Data version</strong>: the exact dataset (DVC hash or dataset version ID)</li>
  <li><strong>Environment</strong>: exact package versions (requirements.txt or conda environment)</li>
  <li><strong>Random seeds</strong>: all sources of randomness explicitly seeded</li>
  <li><strong>Hardware configuration</strong>: GPU model, CUDA version (for exact bit-for-bit reproduction)</li>
</ul>

def set_all_seeds(seed: int = 42):
    """Seed all random number generators for reproducibility."""
    random.seed(seed)
    np.random.seed(seed)
    torch.manual_seed(seed)
    torch.cuda.manual_seed_all(seed)

    torch.backends.cudnn.deterministic = True

from datetime import datetime

def log_reproducibility_info(mlflow_run=None):
    """Log all info needed to reproduce this exact run."""
    info = {
        "git_commit":      subprocess.check_output(
                               ["git", "rev-parse", "HEAD"]).decode().strip(),
        "git_branch":      subprocess.check_output(
                               ["git", "rev-parse", "--abbrev-ref", "HEAD"]).decode().strip(),
        "git_dirty":       bool(subprocess.check_output(["git", "status", "--short"])),
        "timestamp":       datetime.now().isoformat(),
        "python_version":  subprocess.check_output(["python", "--version"]).decode().strip(),
    }
    # Log to MLflow
    if mlflow_run:
        for k, v in info.items():
            mlflow.log_param(f"repro.{k}", v)
    # Also save to file
    with open("run_info.json", "w") as f:
        json.dump(info, f, indent=2)
    return info

# If git_dirty is True: uncommitted changes exist — warn loudly
# A dirty working tree means you cannot reproduce from the commit alone

# Type hints make your function contracts explicit and catch bugs early

import numpy as np
import pandas as pd
from typing import Optional, Tuple, Dict, Any
from pathlib import Path

def load_and_validate(
    data_path: Path,
    target_col: str,
    feature_cols: Optional[list[str]] = None,
    drop_na: bool = True
) -> Tuple[pd.DataFrame, pd.Series]:
    """
    Load a CSV and split into features and target.

    Args:
        data_path: Path to the CSV file.
        target_col: Name of the target column.
        feature_cols: List of feature columns. If None, uses all except target.
        drop_na: Whether to drop rows with missing values.

    Returns:
        Tuple of (X DataFrame, y Series).

    Raises:
        FileNotFoundError: If data_path does not exist.
        ValueError: If target_col is not in the dataset.
    """
    if not data_path.exists():
        raise FileNotFoundError(f"Data file not found: {data_path}")

    df = pd.read_csv(data_path)

    if target_col not in df.columns:
        raise ValueError(f"Target '{target_col}' not in columns: {df.columns.tolist()}")

    if drop_na:
        df = df.dropna()

    cols = feature_cols or [c for c in df.columns if c != target_col]
    return df[cols], df[target_col]

# Run type checking: mypy src/
# mypy catches: wrong argument types, missing return types,

<pre>
def compute_shap_explanation(
    model: GradientBoostingClassifier,
    X: np.ndarray,
    feature_names: list[str],
    max_features: int = 10
) -> dict:
    """
    Compute SHAP feature attributions for a set of predictions.

    Uses TreeSHAP for exact, efficient computation on tree-based models.
    Returns both the raw SHAP values and a formatted explanation dict
    suitable for logging or API responses.

    Args:
        model: A fitted GradientBoostingClassifier.
        X: Feature matrix of shape (n_samples, n_features).
        feature_names: List of feature names in the same order as X columns.
        max_features: Number of top features to include in the summary.

    Returns:
        dict with keys:
            - 'shap_values': np.ndarray of shape (n_samples, n_features)
            - 'base_value': float — the expected model output (baseline)
            - 'top_features': list of (feature_name, mean_abs_shap) tuples,
              sorted descending by importance, limited to max_features

    Raises:
        ValueError: If len(feature_names) != X.shape[1].
        ImportError: If shap is not installed.

    Example:
        result = compute_shap_explanation(model, X_test, feature_names)
        print(result['top_features'][:3])
        # [('worst radius', 0.312), ('worst concave points', 0.287), ...]
    """
    import shap
    if len(feature_names) != X.shape[1]:
        raise ValueError(f"feature_names length {len(feature_names)} "
                         f"!= X.shape[1] {X.shape[1]}")
    explainer  = shap.TreeExplainer(model)
    shap_vals  = explainer.shap_values(X)
    mean_abs   = np.abs(shap_vals).mean(axis=0)
    top_idx    = np.argsort(mean_abs)[::-1][:max_features]
    top_feats  = [(feature_names[i], float(mean_abs[i])) for i in top_idx]
    return {"shap_values": shap_vals,
            "base_value":  explainer.expected_value,
            "top_features": top_feats}
</pre>

<h3>Why ML code review is different</h3>
<p>Standard software code review checks correctness and maintainability. ML code review must additionally catch: data leakage, evaluation methodology errors, statistical issues, and silent correctness bugs where code runs fine but produces wrong models. These bugs rarely cause crashes — they produce quietly wrong results that may only surface in production.</p>

<h3>The ML code review checklist</h3>
<ul>
  <li><strong>Data leakage</strong>: Is the preprocessor fitted on training data only? Are future features used to predict past events? Is there test set contamination anywhere?</li>
  <li><strong>Evaluation methodology</strong>: Is the test set held out from all decisions? Is cross-validation stratified for imbalanced classes? Is the metric appropriate for the task?</li>
  <li><strong>Reproducibility</strong>: Is the random seed set? Is the data version documented? Can I reproduce this result with git clone + make train?</li>
  <li><strong>Statistical validity</strong>: Is the test set large enough for meaningful conclusions? Is the performance improvement statistically significant?</li>
  <li><strong>Efficiency</strong>: Is vectorisation used instead of loops for numerical operations? Are large DataFrames passed by reference correctly?</li>
  <li><strong>Model correctness</strong>: Does the preprocessing match what the model expects? Is the output shape correct? Are categorical columns handled consistently?</li>
</ul>

<h3>Code review anti-patterns to call out</h3>
<pre>

<h3>Roles in a modern ML team</h3>
<p>Understanding who does what prevents duplicated work and misaligned expectations:</p>
<ul>
  <li><strong>ML Researcher</strong>: develops new algorithms, pushes state of the art, publishes. Often less focused on production concerns.</li>
  <li><strong>ML Engineer</strong>: takes research to production. Owns training pipelines, model serving, monitoring. Bridges research and software engineering.</li>
  <li><strong>Data Engineer</strong>: builds and maintains data pipelines, feature stores, and data quality infrastructure. Supplies the foundation for ML.</li>
  <li><strong>MLOps Engineer</strong>: owns the ML platform — experiment tracking, model registry, CI/CD for ML, infrastructure. Enables everyone else.</li>
  <li><strong>Applied Scientist</strong>: applies existing ML methods to business problems. Between researcher and engineer.</li>
</ul>

<h3>The ML project lifecycle</h3>
<ol>
  <li><strong>Problem definition</strong>: ML framing, success metrics, baselines, data feasibility check</li>
  <li><strong>Data exploration and validation</strong>: EDA, data quality assessment, bias analysis</li>
  <li><strong>Baseline model</strong>: simplest model that establishes a performance floor</li>
  <li><strong>Iteration</strong>: feature engineering, model selection, hyperparameter tuning</li>
  <li><strong>Evaluation</strong>: holdout test set, fairness audit, red-teaming</li>
  <li><strong>Production prep</strong>: documentation, serving code, monitoring, CI/CD</li>
  <li><strong>Deployment</strong>: staged rollout, A/B testing</li>
  <li><strong>Maintenance</strong>: monitoring, periodic retraining, model updates</li>
</ol>

<h3>Communication between ML and non-ML stakeholders</h3>
<p>ML engineers must translate between technical reality and business expectations. Common translations:</p>
<ul>
  <li><strong>"The model has 94% accuracy"</strong> → "In 6% of cases, the model is wrong. For your use case with 10,000 decisions/day, that is 600 errors per day. Here are the types of errors it makes and their costs."</li>
  <li><strong>"We need more data"</strong> → "Current performance is X. Our learning curves suggest an additional Y samples would improve it to Z. Here is the data collection cost-benefit analysis."</li>
  <li><strong>"The model is black box"</strong> → "We have implemented SHAP explanations that can explain any individual prediction in plain language. Here is an example for a recent decision."</li>
</ul>

<pre>

## Experiment: [Name]
**Hypothesis**: [What do you believe will improve, and why?]

[What is the current approach? What problem does this solve?]

## Method
[Specific changes: new features, different model, different training strategy]

- Primary metric: [e.g. test AUC >= 0.94]

- Failure criteria: [conditions under which we abandon this experiment]

## Resources required
- Compute: [GPU hours, storage]

[What could go wrong? What is the fallback plan?]

# src/data/load.py — type-annotated, documented, tested
from pathlib import Path
from typing import Tuple, Optional
import pandas as pd
import numpy as np
from sklearn.datasets import load_breast_cancer
from sklearn.model_selection import train_test_split

def load_raw_data(save_path: Optional[Path] = None) -> pd.DataFrame:
    """
    Load the breast cancer dataset and optionally save to CSV.

    Returns:
        DataFrame with 30 features and 'target' column.
        Target: 0 = malignant, 1 = benign.
    """
    data = load_breast_cancer()
    df   = pd.DataFrame(data.data, columns=data.feature_names)
    df['target'] = data.target
    if save_path is not None:
        save_path.parent.mkdir(parents=True, exist_ok=True)
        df.to_csv(save_path, index=False)
    return df

def validate_dataset(df: pd.DataFrame) -> None:
    """
    Validate a cancer dataset. Raises ValueError on any violation.

    Checks: correct feature count, no missing values,
    binary target, no all-constant features.
    """
    expected_features = 30
    if df.shape[1] != expected_features + 1:  # +1 for target
        raise ValueError(f"Expected {expected_features} features, got {df.shape[1]-1}")
    if df.isna().any().any():
        raise ValueError("Dataset contains missing values")
    if not set(df['target'].unique()).issubset({0, 1}):
        raise ValueError("Target must be binary (0 or 1)")
    constant_cols = [c for c in df.columns if df[c].std() == 0]
    if constant_cols:
        raise ValueError(f"Constant feature(s) found: {constant_cols}")

<h3>Step 3 — The model layer (src/models/)</h3>
<pre>
# src/models/train.py
import mlflow
import mlflow.sklearn
import subprocess
from datetime import datetime
from pathlib import Path
from typing import Dict, Any, Tuple
import numpy as np
import pandas as pd
from sklearn.calibration import CalibratedClassifierCV
from sklearn.ensemble import GradientBoostingClassifier
from sklearn.metrics import roc_auc_score, accuracy_score
from sklearn.pipeline import Pipeline
from sklearn.preprocessing import StandardScaler

def get_git_commit() -> str:
    try:
        return subprocess.check_output(
            ["git", "rev-parse", "HEAD"], stderr=subprocess.DEVNULL
        ).decode().strip()
    except Exception:
        return "unknown"

def train_model(
    X_train: pd.DataFrame,
    y_train: pd.Series,
    X_test:  pd.DataFrame,
    y_test:  pd.Series,
    params: Dict[str, Any],
    experiment_name: str = "cancer-classifier"
) -> Tuple[Pipeline, Dict[str, float]]:
    """
    Train and evaluate a GBM classifier with calibration.

    Logs all parameters, metrics, and the model to MLflow.
    Records git commit hash for reproducibility.

    Returns:
        Tuple of (fitted Pipeline, metrics dict).
    """
    mlflow.set_experiment(experiment_name)

    with mlflow.start_run():
        # Log reproducibility info
        mlflow.log_params({
            **params,
            "git_commit":    get_git_commit(),
            "timestamp":     datetime.now().isoformat(),
            "random_seed":   params.get("random_seed", 42),
            "n_train":       len(X_train),
            "n_test":        len(X_test),
        })

        # Build and train
        base = GradientBoostingClassifier(
            n_estimators=params.get("n_estimators", 200),
            learning_rate=params.get("learning_rate", 0.05),
            max_depth=params.get("max_depth", 3),
            random_state=params.get("random_seed", 42),
        )
        model = Pipeline([
            ("scaler", StandardScaler()),
            ("clf",    CalibratedClassifierCV(base, cv=5, method="isotonic"))
        ])
        model.fit(X_train, y_train)

        # Evaluate
        metrics = {
            "test_auc":   roc_auc_score(y_test, model.predict_proba(X_test)[:,1]),
            "test_acc":   accuracy_score(y_test, model.predict(X_test)),
            "train_auc":  roc_auc_score(y_train, model.predict_proba(X_train)[:,1]),
        }
        mlflow.log_metrics(metrics)
        mlflow.sklearn.log_model(model, "model",
                                  registered_model_name="CancerClassifier")

    return model, metrics
</pre>
